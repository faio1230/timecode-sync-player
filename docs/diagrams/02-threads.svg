<text x="48" y="1080" font-size="18" font-weight="400" fill="#475569" text-anchor="start">同じ英字は離れた通知経路の接続先：A＝native の更新通知、B＝プレビュー、C＝UI 更新の予約。</text>
<text x="48" y="1120" font-size="17" font-weight="400" fill="#475569" text-anchor="start">lease＝画像の貸出権。GPU の使用完了まで返さない。generation＝古い画像・通知を見分ける番号。</text>
<text x="48" y="1155" font-size="16" font-weight="400" fill="#475569" text-anchor="start">GStreamer 内部には streaming / bus / pump 等があるため、図の 1 行が必ず 1 本の OS スレッドとは限らない。</text>
