<rect width="1600" height="1590" fill="#ffffff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#243349" text-anchor="start">03  LTC 同期 — 時刻から再生操作まで</text>
<text x="40" y="87" font-size="17" font-weight="400" fill="#243349" text-anchor="start">LtcSyncController が入口を統括。粗いシーク判断と継続再生中の補正は別の判断器を使う。</text>
<text x="1560" y="117" font-size="14" font-weight="400" fill="#64748b" text-anchor="end">v0.4.7 · a4cb181 · 2026-09-20</text>
<path d="M40 118 h38" stroke="#3264c5" stroke-width="2.5" />
<text x="88" y="124" font-size="14" font-weight="400" fill="#243349" text-anchor="start">青：制御・状態</text>
<path d="M285 118 h38" stroke="#8554c2" stroke-width="2.5" />
<text x="333" y="124" font-size="14" font-weight="400" fill="#243349" text-anchor="start">紫：映像データ</text>
<path d="M530 118 h38" stroke="#168399" stroke-width="2.5" stroke-dasharray="7 5" />
<text x="578" y="124" font-size="14" font-weight="400" fill="#243349" text-anchor="start">水色の破線：通知</text>
