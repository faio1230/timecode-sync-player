<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TimecodeSyncPlayer — アーキテクチャ</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8edf3;color:#243349;font:15px "Yu Gothic",Meiryo,sans-serif}header{padding:18px 24px;background:#101e33;color:#eef4ff}h1{font-size:20px;margin:0 0 6px}header p{margin:0;font-size:13px;color:#b5c6df}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px;background:white;border-bottom:1px solid #d9e0eb}button,a{font:inherit}button{border:1px solid #cdd7e6;background:white;border-radius:7px;padding:8px 12px;cursor:pointer;color:#33465e}button[aria-selected=true]{background:#285aba;color:white;border-color:#285aba}.tools{margin-left:auto;display:flex;gap:6px;align-items:center}.tools a{color:#285aba;margin:0 10px}#canvas{height:calc(100vh - 165px);min-height:400px;overflow:auto;padding:20px}section{margin:0 auto;width:1600px;box-shadow:0 3px 25px #152e4d16}section object{display:block;width:100%;height:auto}section[hidden]{display:none}#zoom{min-width:44px;font-size:13px}footer{font-size:12px;color:#53657c;padding:7px 24px}button:focus-visible,a:focus-visible{outline:3px solid #e2a423;outline-offset:2px}@media(max-width:800px){.tools{margin-left:0}#canvas{height:calc(100vh - 235px)}}
</style></head><body><header><h1>TimecodeSyncPlayer の構成を読む</h1><p>現行 v0.4.7 / a4cb181 / 2026-09-20 ・ 全体 → スレッド → 同期 → 寿命の順で確認</p></header><nav role="tablist"><button role="tab" data-page="0" aria-selected="true">01  全体構成</button><button role="tab" data-page="1" aria-selected="false">02  スレッドと映像の流れ</button><button role="tab" data-page="2" aria-selected="false">03  LTC 同期</button><button role="tab" data-page="3" aria-selected="false">04  起動・GPU 復旧・終了</button><div class="tools"><button id="minus" aria-label="縮小">−</button><span id="zoom"></span><button id="plus" aria-label="拡大">＋</button><button id="fit">幅に合わせる</button><a href="architecture.drawio" download>draw.io ファイル</a></div></nav><main id="canvas"><section role="tabpanel" data-panel="0" ><object type="image/svg+xml" data="01-overview.svg?v=2" style="aspect-ratio:1600/1180" aria-label="01  全体構成 — 誰が何を担当するか">01  全体構成 — 誰が何を担当するか</object></section><section role="tabpanel" data-panel="1" hidden><object type="image/svg+xml" data="02-threads.svg?v=2" style="aspect-ratio:1600/1240" aria-label="02  スレッドと映像の流れ">02  スレッドと映像の流れ</object></section><section role="tabpanel" data-panel="2" hidden><object type="image/svg+xml" data="03-sync.svg?v=2" style="aspect-ratio:1600/1590" aria-label="03  LTC 同期 — 時刻から再生操作まで">03  LTC 同期 — 時刻から再生操作まで</object></section><section role="tabpanel" data-panel="3" hidden><object type="image/svg+xml" data="04-lifecycle.svg?v=2" style="aspect-ratio:1600/1290" aria-label="04  起動・GPU 復旧・終了">04  起動・GPU 復旧・終了</object></section></main><footer>図中の部品にマウスを重ねるとコード名を表示します。図はローカルで表示し、外部通信を行いません。</footer><script>
const panels=[...document.querySelectorAll('[data-panel]')],tabs=[...document.querySelectorAll('[data-page]')],canvas=document.querySelector('#canvas');let scale=1;
function resize(){panels.forEach(p=>p.style.width=(1600*scale)+'px');document.querySelector('#zoom').textContent=Math.round(scale*100)+'%'}
function fit(){scale=Math.max(.25,Math.min(1.5,(canvas.clientWidth-40)/1600));resize()}
tabs.forEach((b,i)=>b.onclick=()=>{tabs.forEach((t,j)=>t.setAttribute('aria-selected',j===i));panels.forEach((p,j)=>p.hidden=j!==i);canvas.scrollTop=0;canvas.scrollLeft=0});
document.querySelector('#plus').onclick=()=>{scale=Math.min(2,scale+.15);resize()};document.querySelector('#minus').onclick=()=>{scale=Math.max(.25,scale-.15);resize()};document.querySelector('#fit').onclick=fit;fit();
</script></body></html>
